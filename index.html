<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Offline daily prayer times">
  <title>Prayer Times</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="top-bar">
        <div class="location-bar">
          <div class="location-pills" id="locationPills" role="tablist" aria-label="Locations"></div>
          <button type="button" class="manage-loc-btn" id="openLocModal" aria-expanded="false" aria-controls="locationPanel">Edit</button>
        </div>
        <div class="date-badge" id="currentDate">--</div>
      </div>

      <div class="hero-status" aria-live="polite">
        <h1 class="status-time-diff" id="statusTimeDiff">--</h1>
      </div>
    </header>

    <section class="location-panel" id="locationPanel" hidden aria-labelledby="locationPanelTitle">
      <div class="panel-header">
        <h2 id="locationPanelTitle">Locations</h2>
        <button type="button" class="panel-close" id="closeLocPanel" aria-label="Close locations">Done</button>
      </div>

      <form id="addLocationForm" class="loc-form">
        <div class="form-group">
          <label for="locName">City / Name</label>
          <input type="text" id="locName" name="locName" placeholder="e.g. Home" required autocomplete="address-level2" enterkeyhint="next">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="locLat">Latitude</label>
            <input type="number" step="any" min="-90" max="90" inputmode="decimal" id="locLat" name="locLat" placeholder="0.0000" required enterkeyhint="next">
          </div>
          <div class="form-group">
            <label for="locLng">Longitude</label>
            <input type="number" step="any" min="-180" max="180" inputmode="decimal" id="locLng" name="locLng" placeholder="0.0000" required enterkeyhint="done">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="useGpsBtn" class="btn btn-secondary">Use Device Location</button>
          <button type="submit" class="btn btn-primary">Add Location</button>
        </div>
      </form>

      <div class="saved-loc-section">
        <h3>Saved Locations</h3>
        <div class="saved-locations" id="savedLocationsList"></div>
      </div>
    </section>

    <main class="prayer-list" id="prayerList" role="table" aria-label="Daily prayer schedule"></main>
  </div>

  <script src="praytime.js"></script>
  <script src="app.js"></script>
</body>
</html>
